<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosterUp — Sign In</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <link rel="stylesheet" href="/style/main.css">
  <link rel="stylesheet" href="/style/sign-in.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">
      <a href="index.html" class="auth-back">
        <span class="material-icons">arrow_back</span> Back
      </a>

      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-box">R</div>
          <span class="auth-logo-text">RosterUp</span>
        </div>

        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to your account</p>

        <form class="auth-fields" id="signInForm">
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@email.com" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <div class="auth-row">
            <label class="auth-remember">
              <input type="checkbox">
              Remember me
            </label>
            <a href="forgot-password.html" class="auth-forgot">Forgot password?</a>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
        </form>

        <div id="messageBox" class="alert-box hidden"></div>

        <div class="auth-demo">
          <p class="auth-demo-label">Quick Demo Access</p>
          <div class="auth-demo-grid">
            <button type="button" id="demoEmployeeBtn" class="btn-demo"><span class="material-icons">person</span> Employee View</button>
            <button type="button" id="demoManagerBtn" class="btn-demo"><span class="material-icons">security</span> Manager View</button>
          </div>
        </div>

        <p class="auth-footer-text">
          Don't have an account? <a href="create-account.html">Create Account</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/sign-in.js"></script>
</body>
</html>
