<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosterUp — Profile</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/style/main.css">
  <link rel="stylesheet" href="/style/employee-dashboard.css">
  <link rel="stylesheet" href="/style/employee-profile.css">
</head>
<body>

  <div class="emp-shell">
    <aside class="emp-sidebar">
      <div class="emp-sidebar-header">
        <div class="auth-logo">
          <div class="auth-logo-box" style="width:32px;height:32px;font-size:0.875rem;">R</div>
          <span class="auth-logo-text" style="font-size:1rem;">RosterUp</span>
        </div>
      </div>

      <nav class="emp-nav">
        <a href="employee-dashboard.html" class="emp-nav-item">
          <span class="material-icons">dashboard</span> Dashboard
        </a>
        <a href="employee-open-shifts.html" class="emp-nav-item">
          <span class="material-icons">list</span> Open Shifts
        </a>
        <a href="employee-my-shifts.html" class="emp-nav-item">
          <span class="material-icons">calendar_today</span> My Shifts
        </a>
        <a href="employee-shift-history.html" class="emp-nav-item">
          <span class="material-icons">history</span> Shift History
        </a>
        <a href="employee-chat.html" class="emp-nav-item">
          <span class="material-icons">forum</span> Team Chat
        </a>
        <a href="employee-profile.html" class="emp-nav-item emp-nav-item--active">
          <span class="material-icons">person</span> Profile
        </a>
      </nav>

      <div class="emp-sidebar-footer">
        <div class="emp-user-row">
          <div class="emp-avatar" id="userAvatar">--</div>
          <div style="min-width:0;">
            <p class="emp-user-name" id="userName">Employee</p>
            <p class="emp-user-role" id="userRole">Employee</p>
          </div>
        </div>
        <button class="emp-logout-btn" id="logoutLink">
          <span class="material-icons">logout</span> Logout
        </button>
      </div>
    </aside>

    <main class="emp-main">
      <div class="emp-page-header">
        <h1>Profile</h1>
        <p>Manage your account details</p>
      </div>

      <div class="emp-profile-wrap">
        <div class="emp-stat-card emp-profile-card">
          <div class="emp-profile-top">
            <div class="emp-profile-avatar" id="profileAvatar">--</div>
            <div>
              <h3 id="profileName">—</h3>
              <p id="profileMeta" class="emp-profile-meta">—</p>
              <span id="profileBadge" class="emp-badge">—</span>
            </div>
          </div>
        </div>

        <form class="emp-stat-card emp-profile-card" id="profileForm" novalidate>
          <h3 class="emp-profile-card-title">Personal Information</h3>
          <div class="emp-profile-fields">
            <div class="profile-name-row">
              <div class="field">
                <label for="fieldFirstName">First name</label>
                <input type="text" id="fieldFirstName" maxlength="50" autocomplete="given-name" required>
              </div>
              <div class="field">
                <label for="fieldLastName">Last name</label>
                <input type="text" id="fieldLastName" maxlength="50" autocomplete="family-name" required>
              </div>
            </div>
            <div class="field">
              <label for="fieldEmail">Email address</label>
              <input type="email" id="fieldEmail" maxlength="254" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="fieldRole">Account type</label>
              <input type="text" id="fieldRole" disabled>
            </div>
          </div>
          <div id="profileMessage" class="alert-box hidden"></div>
          <button type="submit" id="profileSaveBtn" class="btn-primary profile-save-btn">Save Changes</button>
        </form>

        <form class="emp-stat-card emp-profile-card" id="passwordForm" novalidate>
          <h3 class="emp-profile-card-title">Change Password</h3>
          <div class="emp-profile-fields">
            <div class="field">
              <label for="currentPassword">Current password</label>
              <input type="password" id="currentPassword" autocomplete="current-password">
            </div>
            <div class="field">
              <label for="newPassword">New password</label>
              <input type="password" id="newPassword" minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
            </div>
            <div class="field">
              <label for="confirmPassword">Confirm new password</label>
              <input type="password" id="confirmPassword" autocomplete="new-password">
            </div>
          </div>
          <div id="passwordMessage" class="alert-box hidden"></div>
          <button type="submit" id="passwordSaveBtn" class="btn-primary profile-save-btn">Update Password</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/emp-utils.js"></script>
  <script src="js/profile-forms.js"></script>
  <script src="js/employee-profile.js"></script>
</body>
</html>
