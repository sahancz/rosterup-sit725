<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosterUp — Forgot Password</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/style/main.css">
  <link rel="stylesheet" href="/style/sign-in.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">
      <a href="sign-in.html" class="auth-back">
        <span class="material-icons">arrow_back</span> Back to sign in
      </a>

      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-box">R</div>
          <span class="auth-logo-text">RosterUp</span>
        </div>

        <h2>Forgot your password?</h2>
        <p class="auth-subtitle">Enter your email and we'll send you a link to choose a new one.</p>

        <form class="auth-fields" id="forgotForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@email.com" maxlength="254" autocomplete="email" required>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">Send Reset Link</button>
        </form>

        <div id="messageBox" class="alert-box hidden"></div>

        <p class="auth-footer-text">
          Remembered it? <a href="sign-in.html">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
