<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RosterUp — Reset Password</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/style/main.css">
  <link rel="stylesheet" href="/style/sign-in.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-wrapper">
      <a href="sign-in.html" class="auth-back">
        <span class="material-icons">arrow_back</span> Back to sign in
      </a>

      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-box">R</div>
          <span class="auth-logo-text">RosterUp</span>
        </div>

        <h2>Choose a new password</h2>
        <p class="auth-subtitle">Your new password must be at least 8 characters.</p>

        <form class="auth-fields" id="resetForm" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" required>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">Reset Password</button>
        </form>

        <div id="messageBox" class="alert-box hidden"></div>

        <a href="sign-in.html" id="signInLink" class="btn-primary reset-sign-in-btn hidden">Go to Sign In</a>

        <p class="auth-footer-text">
          Link expired? <a href="forgot-password.html">Send a new one</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/reset-password.js"></script>
</body>
</html>
