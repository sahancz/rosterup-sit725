services:
  mongo:
    image: mongo:8.0
    container_name: rosterup-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rosterup-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/rosterup
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data: